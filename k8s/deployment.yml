apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app

spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops

  template:
    metadata:
      labels:
        app: devops

    spec:
      containers:
        - name: devops-container
          image: tanmaydevra09/devops-lab-app
          imagePullPolicy: Always
          ports:
            - containerPort: 80
