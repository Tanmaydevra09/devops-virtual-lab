<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevOps CI/CD Virtual Lab</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e6f2ff; /* Pastel Blue */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 400px;
        }

        h1 {
            color: #2b6cb0;
            margin-bottom: 10px;
        }

        p {
            color: #4a5568;
            font-size: 16px;
        }

        .badge {
            margin-top: 20px;
            padding: 10px 15px;
            background: #b3d9ff;
            color: #003366;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #718096;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 DevOps CI/CD Virtual Lab</h1>
    <p>
        Successfully deployed using Git, Terraform, Ansible, Docker & Kubernetes.
    </p>

    <div class="badge">
        Automated Deployment Enabled
    </div>

    <footer>
        Designed by Tanmay Devra | DevOps Pipeline Project
    </footer>
</div>

</body>
</html>
